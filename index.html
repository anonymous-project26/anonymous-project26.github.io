<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="description" content="DexCoach: Sim-to-Real Dynamic Catching through Dexterous Hand and Arm Coordination.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DexCoach: Sim-to-Real Dynamic Catching through Dexterous Hand and Arm Coordination</title>

  <link rel="stylesheet" href="./static/css/bulma.min.css">
  <link rel="stylesheet" href="./static/css/fontawesome.all.min.css">
  <link rel="stylesheet" href="./static/css/index.css">
</head>
<body>

  <nav class="navbar" role="navigation" aria-label="main navigation">
    <div class="container is-max-desktop">
      <div class="navbar-brand">
        <a class="navbar-item has-text-weight-bold" href="./">DexCoach</a>
      </div>
      <div class="navbar-menu is-active">
        <div class="navbar-end">
          <a class="navbar-item" href="#videos">Videos</a>
        </div>
      </div>
    </div>
  </nav>

  <section class="hero project-hero">
    <div class="hero-body">
      <div class="container is-max-desktop">
        <div class="columns is-centered">
          <div class="column has-text-centered">
            <p class="eyebrow">DexHand test video explorer</p>
            <h1 class="title is-1 publication-title">DexCoach: Sim-to-Real Dynamic Catching through Dexterous Hand and Arm Coordination</h1>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="section video-section" id="videos">
    <div class="container is-max-desktop">
      <div class="columns is-variable is-6">
        <main class="column is-two-thirds" aria-live="polite">
          <div class="video-grid" id="video-grid"></div>
        </main>

        <aside class="column is-one-third controls-column">
          <div class="control-panel">
            <p class="eyebrow">Choose a video</p>
            <div class="field">
              <label class="label" for="mode-select">Dataset</label>
              <div class="select is-fullwidth">
                <select id="mode-select">
                  <option value="seen">Seen</option>
                  <option value="unseen">Unseen</option>
                </select>
              </div>
            </div>
            <div class="field">
              <label class="label" id="item-select-label" for="item-select">Shape</label>
              <div class="select is-fullwidth">
                <select id="item-select"></select>
              </div>
            </div>
          </div>
        </aside>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container is-max-desktop">
      <div class="content has-text-centered">
        <p>© 2026 DexCoach.</p>
        <p class="template-credit">
          Page structure adapted from the
          <a href="https://github.com/nerfies/nerfies.github.io">Nerfies project page template</a>,
          licensed under
          <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>.
        </p>
      </div>
    </div>
  </footer>

  <script src="./static/js/video-data.js"></script>
  <script src="./static/js/video-gallery.js"></script>
</body>
</html>
